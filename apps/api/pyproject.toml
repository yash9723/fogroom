[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fogroom-api"
version = "1.0.0"
description = "FOGROOM backend - decision training under information uncertainty"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.9",
  "pwdlib[argon2]>=0.2.1",
  "redis>=5.2",
  "reportlab>=4.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-reportlab",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
# E501: line layout is owned by `ruff format`; long string literals are left intact.
ignore = ["S101", "B008", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/seed.py" = ["S105"]
# Documented dev-only demo password default / OAuth "bearer" token type literal.
"app/core/config.py" = ["S105"]
"app/schemas/auth.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
