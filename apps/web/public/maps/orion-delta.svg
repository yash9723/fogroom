<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <!-- Entirely fictional map: Orion Island (west) and Delta Island (east). -->
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#14324a" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a2c"/>
      <stop offset="1" stop-color="#162224"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" fill="#0b1520"/>
  <rect width="1000" height="640" fill="url(#grid)"/>
  <!-- Orion Island -->
  <path d="M70 250 C 90 150, 210 90, 330 110 C 420 125, 470 190, 480 260 C 492 340, 470 430, 420 490 C 360 560, 240 580, 160 540 C 90 505, 50 400, 70 250 Z"
        fill="url(#land)" stroke="#2c4a4e" stroke-width="2"/>
  <path d="M190 160 C 250 140, 330 150, 380 190" fill="none" stroke="#2a3f42" stroke-width="1.2"/>
  <path d="M220 200 C 270 185, 330 195, 360 225" fill="none" stroke="#2a3f42" stroke-width="1.2"/>
  <!-- Delta Island -->
  <path d="M560 300 C 570 210, 650 150, 750 150 C 850 150, 930 220, 935 320 C 940 420, 880 510, 790 530 C 700 548, 600 500, 570 420 C 555 380, 555 340, 560 300 Z"
        fill="url(#land)" stroke="#2c4a4e" stroke-width="2"/>
  <path d="M650 200 C 700 180, 760 185, 800 215" fill="none" stroke="#2a3f42" stroke-width="1.2"/>
  <!-- Strait and Bridge Orion -->
  <line x1="478" y1="360" x2="562" y2="360" stroke="#7b8796" stroke-width="5" stroke-linecap="round"/>
  <line x1="478" y1="360" x2="562" y2="360" stroke="#0b1520" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- Road network -->
  <path d="M210 430 C 280 400, 330 360, 360 330 C 400 340, 450 352, 478 360" fill="none" stroke="#3b4c55" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M562 360 C 620 380, 700 420, 760 450" fill="none" stroke="#3b4c55" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M300 170 C 320 240, 340 290, 360 330" fill="none" stroke="#3b4c55" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M700 210 C 720 300, 740 380, 760 450" fill="none" stroke="#3b4c55" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Sea lane Harbor Delta -> Kappa Landing -->
  <path d="M770 480 C 700 600, 380 610, 230 470" fill="none" stroke="#2f6f80" stroke-width="1.5" stroke-dasharray="2 6"/>
  <!-- Labels -->
  <g font-family="Inter, Arial, sans-serif" fill="#5f7480" font-size="15" letter-spacing="3">
    <text x="150" y="300">ORION ISLAND</text>
    <text x="660" y="300">DELTA ISLAND</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#41606d" font-size="11" letter-spacing="2">
    <text x="470" y="600">CORAL STRAIT</text>
    <text x="40" y="620">FICTIONAL MAP · NOT TO SCALE</text>
  </g>
</svg>
